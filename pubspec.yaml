name: my_player
description: "A Windows Flutter Music Player."

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.0
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_windows_video: ^1.0.11
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  file_picker: ^10.2.0
  http: ^1.4.0
  flutter_spinkit: ^5.2.1
  cupertino_icons: ^1.0.8
  scrollable_positioned_list: ^0.3.8
  flutter_riverpod: ^2.6.1
  equatable: ^2.0.7
  custom_refresh_indicator: ^4.0.1
  flutter_launcher_icons: ^0.14.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/default_album_art.png
    - assets/Technician Report.pdf
