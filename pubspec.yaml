name: my_player
description: "A new Flutter project."

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  file_picker: ^10.2.0
  http: ^1.4.0
  provider: ^6.1.5
  connectivity_plus: ^6.1.4
  lrc: ^1.0.2
  flutter_spinkit: ^5.2.1

  cupertino_icons: ^1.0.8
  just_audio: ^0.10.4
  scrollable_positioned_list: ^0.3.8
  flutter_riverpod: ^2.6.1
  equatable: ^2.0.7
  custom_refresh_indicator: ^4.0.1
  audio_service: ^0.18.18
  flutter_launcher_icons: ^0.14.4
  on_audio_query_pluse: ^3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# --- Flutter Launcher Icons Configuration ---
flutter_launcher_icons:
  android: truey
  ios: true
  image_path: "assets/default_album_art.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/default_album_art.png"
  adaptive_icon_foreground: "assets/default_album_art.png"
  android_foreground_mode: "auto"

flutter:
  uses-material-design: true

  assets:
    - assets/default_album_art.png